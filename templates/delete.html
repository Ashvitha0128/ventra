{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h3 class="fw-bold mb-3">Confirm Delete</h3>
                    <p class="text-muted">Are you sure you want to permanently delete the product <strong>{{ product.name }}</strong>?</p>
                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item bg-transparent border-top-0 px-0 py-2">
                            <strong>Category:</strong> {{ product.category }}
                        </li>
                        <li class="list-group-item bg-transparent px-0 py-2">
                            <strong>Quantity:</strong> {{ product.quantity }}
                        </li>
                        <li class="list-group-item bg-transparent px-0 py-2">
                            <strong>Minimum Stock:</strong> {{ product.minimum_stock }}
                        </li>
                    </ul>
                    <form method="post" class="d-flex gap-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Yes, delete product</button>
                        <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
