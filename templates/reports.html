
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h3>Sales Summary</h3>
		<form class="d-flex" method="get">
			<input type="date" name="start" class="form-control me-2" value="{{ start }}">
			<input type="date" name="end" class="form-control me-2" value="{{ end }}">
			<button class="btn btn-primary" type="submit">Filter</button>
		</form>
	</div>

	<div class="row mb-3">
		<div class="col-md-4">
			<div class="card p-3">
				<h6 class="mb-1">Total Revenue</h6>
				<h3>₹{{ total_revenue|floatformat:2 }}</h3>
			</div>
		</div>
		<div class="col-md-4">
			<div class="card p-3">
				<h6 class="mb-1">Total Items Sold</h6>
				<h3>{{ total_items }}</h3>
			</div>
		</div>
	</div>

	<div class="card p-3">
		<canvas id="salesChart" height="100"></canvas>
	</div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const labels = {{ labels_json|safe }} || [];
const data = {{ data_json|safe }} || [];
const ctx = document.getElementById('salesChart').getContext('2d');
new Chart(ctx, {
	type: 'line',
	data: {
		labels: labels,
		datasets: [{
			label: 'Revenue',
			data: data,
			borderColor: '#06b6d4',
			backgroundColor: 'rgba(6,182,212,0.12)',
			tension: 0.25,
			fill: true,
		}]
	},
	options: {
		responsive: true,
		plugins: {
			legend: { display: false }
		},
		scales: {
			x: { display: true },
			y: { display: true }
		}
	}
});
</script>

{% endblock %}
