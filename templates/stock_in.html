{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <h3>Stock In - {{ product.name }}</h3>
    <p class="text-muted">Current quantity: <strong>{{ product.quantity }}</strong> | Minimum stock: <strong>{{ product.minimum_stock }}</strong></p>

    <form method="post" class="w-50">
        {% csrf_token %}
        <div class="mb-3">
            <label for="quantity" class="form-label">Quantity to add</label>
            <input type="number" name="quantity" id="quantity" class="form-control" min="1" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Stock</button>
        <a href="{% url 'product_list' %}" class="btn btn-outline-secondary ms-2">Back</a>
    </form>

</div>

{% endblock %}
